<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EA4B71"/><stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#334155"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="20" fill="url(#dots)" opacity=".6"/>

  <!-- title -->
  <text x="72" y="118" font-size="22" fill="#94A3B8" font-weight="600" letter-spacing="3">OPEN LEARNING PATH</text>
  <text x="72" y="182" font-size="60" fill="#F8FAFC" font-weight="800">n8n <tspan fill="url(#accent)">Knowledge</tspan></text>
  <text x="72" y="230" font-size="24" fill="#CBD5E1">42 real workflows · beginner → production AI</text>
  <g font-size="15" font-weight="700">
    <rect x="72" y="262" width="190" height="34" rx="17" fill="#14532D"/><text x="167" y="284" text-anchor="middle" fill="#86EFAC">Core path · 22</text>
    <rect x="272" y="262" width="176" height="34" rx="17" fill="#0C4A6E"/><text x="360" y="284" text-anchor="middle" fill="#7DD3FC">Quick wins · 8</text>
    <rect x="458" y="262" width="176" height="34" rx="17" fill="#4C1D95"/><text x="546" y="284" text-anchor="middle" fill="#D8B4FE">Projects · 12</text>
  </g>

  <!-- mini workflow illustration -->
  <g transform="translate(730,92)">
    <path d="M92,68 C140,68 140,68 188,68" stroke="#64748B" stroke-width="3" fill="none"/>
    <path d="M280,68 C330,68 330,20 376,20" stroke="#64748B" stroke-width="3" fill="none"/>
    <path d="M280,68 C330,68 330,150 376,150" stroke="#64748B" stroke-width="3" fill="none"/>
    <path d="M234,114 C234,160 170,170 150,196" stroke="#A78BFA" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
    <path d="M234,114 C234,160 300,170 318,196" stroke="#A78BFA" stroke-width="2" stroke-dasharray="6 5" fill="none"/>

    <rect x="0" y="22" width="92" height="92" rx="14" fill="#0B1220" stroke="#22C55E" stroke-width="3"/>
    <text x="46" y="80" font-size="34" text-anchor="middle" fill="#22C55E">◷</text>

    <circle cx="234" cy="68" r="58" fill="#7C3AED" opacity=".35" filter="url(#glow)"/>
    <rect x="188" y="22" width="92" height="92" rx="14" fill="#0B1220" stroke="#8B5CF6" stroke-width="3"/>
    <text x="234" y="82" font-size="38" text-anchor="middle" fill="#C4B5FD">✦</text>

    <rect x="376" y="-20" width="80" height="80" rx="14" fill="#0B1220" stroke="#3B82F6" stroke-width="3"/>
    <text x="416" y="32" font-size="30" text-anchor="middle" fill="#93C5FD">▦</text>
    <rect x="376" y="110" width="80" height="80" rx="14" fill="#0B1220" stroke="#EA4B71" stroke-width="3"/>
    <text x="416" y="162" font-size="30" text-anchor="middle" fill="#FDA4AF">✉</text>

    <circle cx="150" cy="222" r="26" fill="#0B1220" stroke="#A78BFA" stroke-width="2.5"/>
    <text x="150" y="231" font-size="22" text-anchor="middle" fill="#C4B5FD" font-weight="700">G</text>
    <circle cx="318" cy="222" r="26" fill="#0B1220" stroke="#A78BFA" stroke-width="2.5"/>
    <text x="318" y="230" font-size="18" text-anchor="middle" fill="#C4B5FD" font-weight="700">{ }</text>
  </g>
</svg>
