<text x="-4" y="-228" font-size="13" fill="#E5E7EB" font-weight="600">P04 · Multi-touch sales follow-up sequence (Wait nodes + reply detection)</text>
<rect x="-40" y="-175" width="580" height="135" rx="8" fill="#FFF8DB" stroke="#F2D675"/>
<text x="-26" y="-147" font-size="15" fill="#5B4B12" font-weight="700">📬 P04 · Follow-ups that stop when they reply</text>
<text x="-26" y="-125" font-size="12.5" fill="#5B4B12" font-weight="400">Three stages: email → wait → replied?</text>
<text x="-26" y="-108" font-size="12.5" fill="#5B4B12" font-weight="400">• yes → CRM repliedafteremailN + Slack alert, sequence stops</text>
<text x="-26" y="-91" font-size="12.5" fill="#5B4B12" font-weight="400">• no → next email</text>
<text x="-26" y="-74" font-size="12.5" fill="#5B4B12" font-weight="400">After email 3 the lead is closed as noreplyclosed.</text>
<text x="-26" y="-57" font-size="12.5" fill="#5B4B12" font-weight="400">⚠️ Long waits need a persistent DB (Postgres) and an always-on n8n.</text>
