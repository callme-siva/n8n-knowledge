<text x="-4" y="-334" font-size="13" fill="#E5E7EB" font-weight="600">P04 · Multi-touch sales follow-up sequence (Wait nodes + reply detection)</text>
<rect x="-40" y="-281" width="580" height="101" rx="8" fill="#FFF8DB" stroke="#F2D675"/>
<text x="-26" y="-253" font-size="15" fill="#5B4B12" font-weight="700">📬 P04 · Follow-ups that stop when they reply</text>
<text x="-26" y="-231" font-size="12.5" fill="#5B4B12" font-weight="400">New lead → email 1 → wait 3 days → replied? stop : email 2 → wait 4 days → replied?</text>
<text x="-26" y="-214" font-size="12.5" fill="#5B4B12" font-weight="400">stop : final email. Every step updates the CRM sheet.</text>
<text x="-26" y="-197" font-size="12.5" fill="#5B4B12" font-weight="400">⚠️ Long waits need a persistent DB (Postgres) and an always-on n8n.</text>
