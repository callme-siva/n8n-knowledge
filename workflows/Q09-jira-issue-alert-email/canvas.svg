<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -234 1140 651" width="1140" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
<defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#D5D9E0"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity=".10"/></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker></defs>
<rect x="-80" y="-234" width="1140" height="651" rx="14" fill="#F8FAFC"/>
