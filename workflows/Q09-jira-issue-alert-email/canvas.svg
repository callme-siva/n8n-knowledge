<rect x="-80" y="-234" width="1140" height="36" rx="14" fill="#1F2937"/><rect x="-80" y="-214" width="1140" height="16" fill="#1F2937"/>
<circle cx="-60" cy="-216" r="5" fill="#FF5F57"/><circle cx="-42" cy="-216" r="5" fill="#FEBC2E"/><circle cx="-24" cy="-216" r="5" fill="#28C840"/>
<text x="-4" y="-211" font-size="13" fill="#E5E7EB" font-weight="600">Q09 · Jira issue alert → email (Webhook)</text>
<rect x="-40" y="-158" width="460" height="118" rx="8" fill="#FFF8DB" stroke="#F2D675"/>
<text x="-26" y="-130" font-size="15" fill="#5B4B12" font-weight="700">🔔 Q09 · Jira → your inbox</text>
<text x="-26" y="-108" font-size="12.5" fill="#5B4B12" font-weight="400">Jira posts a webhook the moment an issue is created → n8n emails</text>
<text x="-26" y="-91" font-size="12.5" fill="#5B4B12" font-weight="400">you a clean summary.</text>
<text x="-26" y="-74" font-size="12.5" fill="#5B4B12" font-weight="400">Protected by Header Auth: only calls with the right key are</text>
<text x="-26" y="-57" font-size="12.5" fill="#5B4B12" font-weight="400">accepted.</text>
<rect x="660" y="220" width="300" height="157" rx="8" fill="#FFF8DB" stroke="#F2D675"/>
<text x="674" y="248" font-size="15" fill="#5B4B12" font-weight="700">⚠️ No email? Check key in this</text>
<text x="674" y="270" font-size="15" fill="#5B4B12" font-weight="700">node&#x27;s output.</text>
<text x="674" y="292" font-size="12.5" fill="#5B4B12" font-weight="400">Fires only if the webhook body actually</text>
<text x="674" y="309" font-size="12.5" fill="#5B4B12" font-weight="400">contains a Jira issue (set in Extract</text>
<text x="674" y="326" font-size="12.5" fill="#5B4B12" font-weight="400">Issue).</text>
<text x="674" y="343" font-size="12.5" fill="#5B4B12" font-weight="400">To test: send the sample curl below before</text>
<text x="674" y="360" font-size="12.5" fill="#5B4B12" font-weight="400">wiring up real Jira.</text>
<path d="M100,50.0 C160.0,50.0 160.0,50.0 216,50.0" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<path d="M320,50.0 C380.0,50.0 380.0,50.0 436,50.0" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<path d="M540,50.0 C600.0,50.0 600.0,50.0 656,50.0" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<path d="M760,50.0 C820.0,50.0 820.0,50.0 876,50.0" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<rect x="0" y="0" width="100" height="100" rx="10" fill="#FFFFFF" stroke="#2EA44F" stroke-width="2" filter="url(#sh)"/>
<path d="M30,0 H10 A10,10 0 0 0 0,10 V90 A10,10 0 0 0 10,100 H30" fill="none" stroke="#2EA44F" stroke-width="5"/>
<rect x="22" y="18" width="56" height="56" rx="12" fill="#E8F7EE"/>
<text x="50" y="55" font-size="24" text-anchor="middle" fill="#2EA44F" font-weight="700">⚓</text>
<text x="50.0" y="120" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600">Jira Webhook</text>
<rect x="220" y="0" width="100" height="100" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2" filter="url(#sh)"/>
<rect x="242" y="18" width="56" height="56" rx="12" fill="#EEF2F7"/>
<text x="270" y="55" font-size="24" text-anchor="middle" fill="#64748B" font-weight="700">✎</text>
<text x="270.0" y="120" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600">⚙️ Config</text>
<rect x="440" y="0" width="100" height="100" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2" filter="url(#sh)"/>
<rect x="462" y="18" width="56" height="56" rx="12" fill="#EEF2F7"/>
<text x="490" y="55" font-size="16" text-anchor="middle" fill="#64748B" font-weight="700">{ }</text>
<text x="490.0" y="120" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600">Extract Issue</text>
<rect x="660" y="0" width="100" height="100" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2" filter="url(#sh)"/>
<rect x="682" y="18" width="56" height="56" rx="12" fill="#FFF4E5"/>
<text x="710" y="55" font-size="24" text-anchor="middle" fill="#F59E0B" font-weight="700">⊻</text>
<text x="710.0" y="120" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600">Worth Alerting?</text>
<rect x="880" y="0" width="100" height="100" rx="10" fill="#FFFFFF" stroke="#E11D48" stroke-width="2" filter="url(#sh)"/>
<rect x="902" y="18" width="56" height="56" rx="12" fill="#FFEDEF"/>
<text x="930" y="55" font-size="24" text-anchor="middle" fill="#E11D48" font-weight="700">✉</text>
<text x="930.0" y="120" font-size="12.5" text-anchor="middle" fill="#1F2937" font-weight="600">Email Alert</text>
</svg>