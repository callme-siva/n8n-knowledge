<text x="-46" y="-247" font-size="15" fill="#5B4B12" font-weight="700">🚨 L19 · Never fail silently</text>
<text x="-46" y="-225" font-size="12.5" fill="#5B4B12" font-weight="400">1. Save this workflow.</text>
<text x="-46" y="-208" font-size="12.5" fill="#5B4B12" font-weight="400">2. In every other workflow: ⋯ → Settings → Error workflow → pick L19.</text>
<text x="-46" y="-191" font-size="12.5" fill="#5B4B12" font-weight="400">3. Any failed production run now sends a formatted alert and logs it</text>
<text x="-46" y="-174" font-size="12.5" fill="#5B4B12" font-weight="400">to a sheet.</text>
<text x="-46" y="-157" font-size="12.5" fill="#5B4B12" font-weight="400">Test: run L04 with base = XYZ.</text>
