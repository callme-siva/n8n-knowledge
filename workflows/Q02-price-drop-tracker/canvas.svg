<text x="-4" y="-194" font-size="13" fill="#E5E7EB" font-weight="600">Q02 · Price drop tracker (web scraping + state)</text>
<rect x="-40" y="-141" width="460" height="101" rx="8" fill="#FFF8DB" stroke="#F2D675"/>
<text x="-26" y="-113" font-size="15" fill="#5B4B12" font-weight="700">🏷️ Q02 · Watch a product price</text>
<text x="-26" y="-91" font-size="12.5" fill="#5B4B12" font-weight="400">Scrapes a product page every 6 h, remembers the last price, alerts</text>
<text x="-26" y="-74" font-size="12.5" fill="#5B4B12" font-weight="400">when it drops below your target or drops by 5%.</text>
<text x="-26" y="-57" font-size="12.5" fill="#5B4B12" font-weight="400">Demo site: books.toscrape.com (built for scraping practice).</text>
<rect x="440" y="486" width="300" height="157" rx="8" fill="#FFF8DB" stroke="#F2D675"/>
<text x="454" y="514" font-size="15" fill="#5B4B12" font-weight="700">⚠️ No email? Check alert in this</text>
<text x="454" y="536" font-size="15" fill="#5B4B12" font-weight="700">node&#x27;s output.</text>
<text x="454" y="558" font-size="12.5" fill="#5B4B12" font-weight="400">Fires only if price ≤ target or it dropped</text>
<text x="454" y="575" font-size="12.5" fill="#5B4B12" font-weight="400">≥5% since the last check (set in Compare</text>
<text x="454" y="592" font-size="12.5" fill="#5B4B12" font-weight="400">with Last Price).</text>
<text x="454" y="609" font-size="12.5" fill="#5B4B12" font-weight="400">To test: set target above the current</text>
<text x="454" y="626" font-size="12.5" fill="#5B4B12" font-weight="400">price, then run it.</text>
