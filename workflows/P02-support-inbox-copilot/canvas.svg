<text x="-26" y="-173" font-size="15" fill="#5B4B12" font-weight="700">🎧 P02 · AI drafts, humans send</text>
<text x="-26" y="-151" font-size="12.5" fill="#5B4B12" font-weight="400">Classifies each support email, answers only from your FAQ sheet, scores its own</text>
<text x="-26" y="-134" font-size="12.5" fill="#5B4B12" font-weight="400">confidence, and either creates a Gmail draft for an agent to review or escalates</text>
<text x="-26" y="-117" font-size="12.5" fill="#5B4B12" font-weight="400">to Slack. It never sends by itself.</text>
