<text x="-4" y="-511" font-size="13" fill="#E5E7EB" font-weight="600">P05 · Bulk AI enrichment of 1,000s of rows (batches, rate limits, checkpoints, resume)</text>
<rect x="-40" y="-458" width="580" height="118" rx="8" fill="#FFF8DB" stroke="#F2D675"/>
<text x="-26" y="-430" font-size="15" fill="#5B4B12" font-weight="700">🏗️ P05 · Process big lists safely</text>
<text x="-26" y="-408" font-size="12.5" fill="#5B4B12" font-weight="400">Reads only status = pending rows → Loop Over Items in batches of 10 → Gemini</text>
<text x="-26" y="-391" font-size="12.5" fill="#5B4B12" font-weight="400">classifies each company → writes back status = done (or error) → waits 2 s → next</text>
<text x="-26" y="-374" font-size="12.5" fill="#5B4B12" font-weight="400">batch.</text>
<text x="-26" y="-357" font-size="12.5" fill="#5B4B12" font-weight="400">Stop it any time; the next run resumes where it left off.</text>
