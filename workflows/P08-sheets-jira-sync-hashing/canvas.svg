<text x="-26" y="-253" font-size="15" fill="#5B4B12" font-weight="700">🔄 P08 · Sync without duplicates</text>
<text x="-26" y="-231" font-size="12.5" fill="#5B4B12" font-weight="400">Business users plan in a sheet; engineers work in Jira. Every 15 min: rows without a</text>
<text x="-26" y="-214" font-size="12.5" fill="#5B4B12" font-weight="400">Jira key are created, rows whose content hash changed are updated, unchanged rows</text>
<text x="-26" y="-197" font-size="12.5" fill="#5B4B12" font-weight="400">are skipped. Key + hash are written back.</text>
