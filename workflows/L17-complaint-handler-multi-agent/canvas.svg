<rect x="-60" y="-46" width="520" height="118" rx="8" fill="#FFF8DB" stroke="#F2D675"/>
<text x="-46" y="-18" font-size="15" fill="#5B4B12" font-weight="700">🎧 L17 · Production-style AI pipeline</text>
<text x="-46" y="4" font-size="12.5" fill="#5B4B12" font-weight="400">Understand → Investigate → Resolve → Escalate? → Draft reply.</text>
<text x="-46" y="21" font-size="12.5" fill="#5B4B12" font-weight="400">Every agent returns validated JSON; each parser has its own fix model that</text>
<text x="-46" y="38" font-size="12.5" fill="#5B4B12" font-weight="400">repairs bad JSON automatically.</text>
<text x="-46" y="55" font-size="12.5" fill="#5B4B12" font-weight="400">⚠️ Add a human approval (L15) before auto-sending in real life.</text>
