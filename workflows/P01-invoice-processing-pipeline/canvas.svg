<text x="-4" y="-194" font-size="13" fill="#E5E7EB" font-weight="600">P01 · Accounts-payable invoice pipeline (extract → validate → dedupe → approve → ledger)</text>
<rect x="-40" y="-141" width="560" height="101" rx="8" fill="#FFF8DB" stroke="#F2D675"/>
<text x="-26" y="-113" font-size="15" fill="#5B4B12" font-weight="700">🧾 P01 · Accounts payable, automated</text>
<text x="-26" y="-91" font-size="12.5" fill="#5B4B12" font-weight="400">PDF invoices arrive by email → text extracted → Gemini extracts fields → maths &amp;</text>
<text x="-26" y="-74" font-size="12.5" fill="#5B4B12" font-weight="400">GSTIN validated in code → duplicates blocked → big invoices need human approval →</text>
<text x="-26" y="-57" font-size="12.5" fill="#5B4B12" font-weight="400">ledger row. Bad ones go to an Exceptions sheet.</text>
<rect x="800" y="416" width="300" height="184" rx="8" fill="#FFF8DB" stroke="#F2D675"/>
<text x="814" y="444" font-size="15" fill="#5B4B12" font-weight="700">⚠️ Same invoice twice? It&#x27;s skipped</text>
<text x="814" y="466" font-size="15" fill="#5B4B12" font-weight="700">here if its dedupekey (vendor +</text>
<text x="814" y="488" font-size="15" fill="#5B4B12" font-weight="700">invoice no.) is already in the</text>
<text x="814" y="510" font-size="15" fill="#5B4B12" font-weight="700">Ledger sheet.</text>
<text x="814" y="532" font-size="12.5" fill="#5B4B12" font-weight="400">The ledger is the memory, so an invoice</text>
<text x="814" y="549" font-size="12.5" fill="#5B4B12" font-weight="400">that failed to append or was rejected is</text>
<text x="814" y="566" font-size="12.5" fill="#5B4B12" font-weight="400">picked up again next time.</text>
<text x="814" y="583" font-size="12.5" fill="#5B4B12" font-weight="400">To re-test: delete its Ledger row.</text>
